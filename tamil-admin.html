<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Tamil Study | Admin Panel</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    padding:25px;
    font-family:Arial,"Segoe UI",sans-serif;
    background:
        radial-gradient(circle at 10% 10%,rgba(255,255,255,.8),transparent 25%),
        #f7f0d7;
    color:#302719;
}

.container{
    width:min(1250px,100%);
    margin:auto;
}

.header{
    background:#fffdf5;
    border:5px solid #4b3b25;
    border-radius:28px;
    padding:25px 30px;
    box-shadow:
        7px 8px 0 #f4d46b,
        0 15px 35px rgba(73,55,22,.15);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:30px;
}

.logo{
    font-size:34px;
    font-weight:800;
}

.logo span{
    color:#a06d08;
}

.header-right{
    display:flex;
    align-items:center;
    gap:15px;
}

.admin-email{
    font-size:13px;
    color:#776b56;
    font-weight:700;
}

.logout{
    border:3px solid #4b3b25;
    border-radius:13px;
    background:#e6bd45;
    padding:9px 15px;
    font-weight:800;
    cursor:pointer;
    box-shadow:3px 4px 0 #4b3b25;
}

.logout:hover{
    transform:translateY(-2px);
}

.title{
    margin-bottom:20px;
    font-size:27px;
    font-weight:800;
}

.status-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-bottom:30px;
}

.stat{
    background:#fffdf5;
    border:3px solid #4b3b25;
    border-radius:20px;
    padding:20px;
    box-shadow:4px 5px 0 #f4d46b;
}

.stat-label{
    color:#776b56;
    font-size:13px;
    font-weight:700;
}

.stat-number{
    font-size:34px;
    font-weight:800;
    margin-top:4px;
}

.card{
    background:#fffdf5;
    border:4px solid #4b3b25;
    border-radius:25px;
    padding:25px;
    margin-bottom:22px;
    box-shadow:5px 6px 0 #f4d46b;
    animation:cardIn .35s ease;
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(12px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.user-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
    margin-bottom:18px;
}

.user-name{
    font-size:22px;
    font-weight:800;
}

.user-email{
    color:#776b56;
    font-size:13px;
    margin-top:5px;
    word-break:break-word;
}

.badge{
    padding:6px 12px;
    border-radius:20px;
    background:#fff1b8;
    border:2px solid #c79519;
    color:#6e4c00;
    font-size:12px;
    font-weight:800;
}

.details{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px;
}

.detail{
    background:#fff8df;
    border:2px solid #c79519;
    border-radius:15px;
    padding:12px;
}

.detail-label{
    font-size:11px;
    color:#776b56;
    font-weight:700;
}

.detail-value{
    font-weight:800;
    margin-top:3px;
    word-break:break-word;
}

.actions{
    display:flex;
    gap:12px;
    margin-top:20px;
}

.action{
    border:3px solid #4b3b25;
    border-radius:13px;
    padding:10px 20px;
    font-family:Arial,sans-serif;
    font-weight:800;
    cursor:pointer;
    box-shadow:3px 4px 0 #4b3b25;
    transition:.2s ease;
}

.approve{
    background:#b9df9c;
    color:#29461d;
}

.reject{
    background:#ffb4a7;
    color:#6c2117;
}

.action:hover{
    transform:translateY(-2px);
}

.action:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.empty{
    text-align:center;
    padding:50px 20px;
    color:#776b56;
}

.empty-icon{
    font-size:50px;
    margin-bottom:10px;
}

.loading{
    text-align:center;
    padding:40px;
    font-weight:800;
}

.error{
    background:#ffe3d9;
    border:3px solid #a84a2a;
    border-radius:15px;
    padding:15px;
    margin-bottom:20px;
    color:#7d301b;
    font-weight:700;
}

.success{
    background:#e5f5d8;
    border:3px solid #5b8c3a;
    border-radius:15px;
    padding:15px;
    margin-bottom:20px;
    color:#31521f;
    font-weight:700;
}

.refresh{
    border:3px solid #4b3b25;
    border-radius:13px;
    padding:9px 15px;
    background:#fff8df;
    font-weight:800;
    cursor:pointer;
    box-shadow:3px 4px 0 #4b3b25;
    margin-bottom:20px;
}

.refresh:hover{
    transform:translateY(-2px);
}

/* LOGIN */

#adminLogin{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:min(450px,100%);
    background:#fffdf5;
    border:5px solid #4b3b25;
    border-radius:28px;
    padding:35px;
    text-align:center;
    box-shadow:
        7px 8px 0 #f4d46b,
        0 20px 40px rgba(73,55,22,.15);
}

.login-icon{
    font-size:60px;
    margin-bottom:15px;
}

.login-box h1{
    font-size:30px;
}

.login-box p{
    margin-top:8px;
    color:#776b56;
    line-height:1.5;
}

.login-form{
    margin-top:25px;
    text-align:left;
}

.login-form label{
    display:block;
    font-size:13px;
    font-weight:800;
    margin-bottom:7px;
}

.login-form input{
    width:100%;
    padding:13px;
    border:3px solid #4b3b25;
    border-radius:13px;
    background:#fff8df;
    color:#302719;
    font-size:15px;
    outline:none;
}

.login-form input:focus{
    border-color:#a06d08;
}

.login-button{
    width:100%;
    margin-top:18px;
    border:3px solid #4b3b25;
    border-radius:13px;
    padding:13px;
    background:#e6bd45;
    color:#302719;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    box-shadow:4px 5px 0 #4b3b25;
}

.login-button:hover{
    transform:translateY(-2px);
}

.login-error{
    display:none;
    margin-top:15px;
    background:#ffe3d9;
    border:2px solid #a84a2a;
    border-radius:12px;
    padding:10px;
    color:#7d301b;
    font-size:13px;
    font-weight:700;
}

#adminPanel{
    display:none;
}

@media(max-width:750px){

    body{
        padding:12px;
    }

    .header{
        flex-direction:column;
        align-items:flex-start;
    }

    .header-right{
        width:100%;
        justify-content:space-between;
    }

    .status-grid{
        grid-template-columns:1fr;
    }

    .details{
        grid-template-columns:1fr;
    }

    .actions{
        flex-direction:column;
    }

    .action{
        width:100%;
    }

    .logo{
        font-size:28px;
    }

}

</style>

</head>

<body>


<!-- =====================================================
     ADMIN LOGIN
     ===================================================== -->

<section id="adminLogin">

    <div class="login-box">

        <div class="login-icon">
            🔐
        </div>

        <h1>
            Tamil Admin
        </h1>

        <p>
            Enter the administrator password
            to manage student payments.
        </p>

        <form
            class="login-form"
            onsubmit="adminLogin(event)"
        >

            <label for="adminPassword">
                Admin Password
            </label>

            <input
                id="adminPassword"
                type="password"
                placeholder="Enter admin password"
                autocomplete="current-password"
                required
            >

            <button
                type="submit"
                class="login-button"
            >
                🔓 Login to Admin Panel
            </button>

            <div
                id="loginError"
                class="login-error"
            >
                Incorrect password.
            </div>

        </form>

    </div>

</section>


<!-- =====================================================
     ADMIN PANEL
     ===================================================== -->

<section id="adminPanel">

<div class="container">

    <header class="header">

        <div class="logo">
            📖 Tamil <span>Admin</span>
        </div>

        <div class="header-right">

            <div
                id="adminEmail"
                class="admin-email"
            >
                Administrator
            </div>

            <button
                class="logout"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </header>


    <h1 class="title">
        Payment Verification
    </h1>


    <div class="status-grid">

        <div class="stat">

            <div class="stat-label">
                Pending Payments
            </div>

            <div
                id="pendingCount"
                class="stat-number"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Approved
            </div>

            <div
                id="approvedCount"
                class="stat-number"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Rejected
            </div>

            <div
                id="rejectedCount"
                class="stat-number"
            >
                0
            </div>

        </div>

    </div>


    <button
        class="refresh"
        onclick="loadPayments()"
    >
        ↻ Refresh Payments
    </button>


    <div id="errorBox"></div>


    <div id="usersContainer">

        <div class="loading">
            Loading payment requests...
        </div>

    </div>

</div>

</section>


<script>

/* =====================================================
   SUPABASE CONFIGURATION
   ===================================================== */

const SUPABASE_URL =
    "https://ozsnvtbregzknawdyncg.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_psAoSdnCvmGBUt38h9ihxQ_evtiqbBi";


/* =====================================================
   ADMIN PASSWORD
   ===================================================== */

const ADMIN_PASSWORD =
    "admin123";


/* =====================================================
   ELEMENTS
   ===================================================== */

const loginScreen =
    document.getElementById("adminLogin");

const adminPanel =
    document.getElementById("adminPanel");

const container =
    document.getElementById("usersContainer");

const errorBox =
    document.getElementById("errorBox");


/* =====================================================
   ADMIN LOGIN
   ===================================================== */

function adminLogin(event){

    event.preventDefault();

    const password =
        document
            .getElementById("adminPassword")
            .value;

    const loginError =
        document.getElementById("loginError");


    if(password === ADMIN_PASSWORD){

        localStorage.setItem(
            "tamil_admin_logged_in",
            "true"
        );

        loginError.style.display =
            "none";

        loginScreen.style.display =
            "none";

        adminPanel.style.display =
            "block";

        loadPayments();

    }else{

        loginError.style.display =
            "block";

        document
            .getElementById("adminPassword")
            .value = "";

    }

}


/* =====================================================
   LOGOUT
   ===================================================== */

function logout(){

    localStorage.removeItem(
        "tamil_admin_logged_in"
    );

    window.location.reload();

}


/* =====================================================
   CHECK LOGIN
   ===================================================== */

function checkLogin(){

    const loggedIn =
        localStorage.getItem(
            "tamil_admin_logged_in"
        );


    if(loggedIn === "true"){

        loginScreen.style.display =
            "none";

        adminPanel.style.display =
            "block";

        loadPayments();

    }else{

        loginScreen.style.display =
            "flex";

        adminPanel.style.display =
            "none";

    }

}


/* =====================================================
   LOAD PAYMENTS
   ===================================================== */

async function loadPayments(){

    container.innerHTML = `
        <div class="loading">
            Loading payment requests...
        </div>
    `;

    errorBox.innerHTML = "";


    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/payments" +
                "?select=*" +
                "&order=created_at.desc",
                {
                    method:"GET",

                    headers:{
                        "apikey":SUPABASE_KEY,
                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY
                    }
                }
            );


        if(!response.ok){

            const errorText =
                await response.text();

            throw new Error(
                errorText ||
                "Unable to load payments."
            );

        }


        const data =
            await response.json();


        /* =================================================
           COUNTS
           ================================================= */

        const pending =
            data.filter(
                payment =>
                    String(payment.status)
                        .toLowerCase()
                        .trim() === "pending"
            ).length;


        const approved =
            data.filter(
                payment =>
                    String(payment.status)
                        .toLowerCase()
                        .trim() === "approved"
            ).length;


        const rejected =
            data.filter(
                payment =>
                    String(payment.status)
                        .toLowerCase()
                        .trim() === "rejected"
            ).length;


        document.getElementById(
            "pendingCount"
        ).textContent = pending;


        document.getElementById(
            "approvedCount"
        ).textContent = approved;


        document.getElementById(
            "rejectedCount"
        ).textContent = rejected;


        /* =================================================
           SHOW ONLY PENDING
           ================================================= */

        const pendingPayments =
            data.filter(
                payment =>
                    String(payment.status)
                        .toLowerCase()
                        .trim() === "pending"
            );


        if(pendingPayments.length === 0){

            container.innerHTML = `

                <div class="card">

                    <div class="empty">

                        <div class="empty-icon">
                            🎉
                        </div>

                        <h2>
                            No Pending Payments
                        </h2>

                        <p style="margin-top:8px">
                            There are currently no payment
                            requests waiting for verification.
                        </p>

                    </div>

                </div>

            `;

            return;

        }


        container.innerHTML = "";


        /* =================================================
           CREATE PAYMENT CARDS
           ================================================= */

        pendingPayments.forEach(
            function(payment){

                const card =
                    document.createElement("div");

                card.className =
                    "card";


                const email =
                    payment.email ||
                    "Email not available";


                const utr =
                    payment.utr ||
                    "UTR not available";


                const created =
                    payment.created_at
                        ? new Date(
                            payment.created_at
                        ).toLocaleString()
                        : "Date not available";


                card.innerHTML = `

                    <div class="user-header">

                        <div>

                            <div class="user-name">
                                Student Payment
                            </div>

                            <div class="user-email">
                                ${escapeHtml(email)}
                            </div>

                        </div>

                        <div class="badge">
                            PENDING
                        </div>

                    </div>


                    <div class="details">


                        <div class="detail">

                            <div class="detail-label">
                                Amount
                            </div>

                            <div class="detail-value">
                                ₹50
                            </div>

                        </div>


                        <div class="detail">

                            <div class="detail-label">
                                UTR / Transaction ID
                            </div>

                            <div class="detail-value">
                                ${escapeHtml(utr)}
                            </div>

                        </div>


                        <div class="detail">

                            <div class="detail-label">
                                Submitted
                            </div>

                            <div class="detail-value">
                                ${escapeHtml(created)}
                            </div>

                        </div>


                    </div>


                    <div class="actions">

                        <button
                            class="action approve"
                            onclick="
                                updatePayment(
                                    '${escapeJs(payment.id)}',
                                    'approved',
                                    this
                                )
                            "
                        >
                            ✓ Approve Payment
                        </button>


                        <button
                            class="action reject"
                            onclick="
                                updatePayment(
                                    '${escapeJs(payment.id)}',
                                    'rejected',
                                    this
                                )
                            "
                        >
                            ✕ Reject Payment
                        </button>

                    </div>

                `;


                container.appendChild(card);

            }
        );

    }
    catch(error){

        console.error(error);

        errorBox.innerHTML = `

            <div class="error">

                ❌ ${escapeHtml(
                    error.message
                )}

            </div>

        `;

        container.innerHTML = "";

    }

}


/* =====================================================
   APPROVE / REJECT PAYMENT
   ===================================================== */

async function updatePayment(
    paymentId,
    newStatus,
    button
){

    const confirmation =
        newStatus === "approved"
            ? "Approve this ₹50 payment?"
            : "Reject this payment?";


    if(!confirm(confirmation)){
        return;
    }


    const buttons =
        button
            .parentElement
            .querySelectorAll("button");


    buttons.forEach(
        function(btn){
            btn.disabled = true;
        }
    );


    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/payments" +
                "?id=eq." +
                encodeURIComponent(
                    paymentId
                ),
                {
                    method:"PATCH",

                    headers:{
                        "apikey":SUPABASE_KEY,
                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,
                        "Content-Type":
                            "application/json",
                        "Prefer":
                            "return=minimal"
                    },

                    body:JSON.stringify({
                        status:newStatus
                    })
                }
            );


        if(!response.ok){

            const errorText =
                await response.text();

            throw new Error(
                errorText ||
                "Payment update failed."
            );

        }


        await loadPayments();

    }
    catch(error){

        console.error(error);

        alert(
            "Payment update failed:\n\n" +
            error.message
        );


        buttons.forEach(
            function(btn){
                btn.disabled = false;
            }
        );

    }

}


/* =====================================================
   HTML ESCAPING
   ===================================================== */

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function escapeJs(value){

    return String(value ?? "")
        .replaceAll("\\","\\\\")
        .replaceAll("'","\\'");

}


/* =====================================================
   START
   ===================================================== */

checkLogin();

</script>

</body>
</html>
