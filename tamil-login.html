<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tamil Study | Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    font-family:Arial,"Noto Sans Tamil",sans-serif;
    background:
        radial-gradient(circle at 15% 20%,rgba(255,255,255,.85),transparent 25%),
        radial-gradient(circle at 85% 80%,rgba(230,189,69,.15),transparent 25%),
        #f7f0d7;
    color:#302719;
}

.card{
    width:min(460px,100%);
    background:#fffdf5;
    border:5px solid #4b3b25;
    border-radius:32px;
    padding:42px 35px;
    box-shadow:
        8px 9px 0 #f4d46b,
        0 18px 45px rgba(73,55,22,.18);
    animation:appear .6s ease;
}

@keyframes appear{
    from{opacity:0;transform:translateY(25px) scale(.97)}
    to{opacity:1;transform:translateY(0) scale(1)}
}

.icon{text-align:center;font-size:42px;margin-bottom:8px}

.logo{
    text-align:center;
    font-size:48px;
    font-weight:800;
    letter-spacing:3px;
    text-shadow:3px 3px 0 #f4d46b;
}

.title{
    text-align:center;
    font-size:24px;
    font-weight:800;
    margin-top:8px;
}

.subtitle{
    text-align:center;
    color:#776b56;
    font-size:14px;
    margin:7px 0 28px;
}

.group{margin-bottom:18px}

label{
    display:block;
    font-size:14px;
    font-weight:800;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px 15px;
    border:3px solid #4b3b25;
    border-radius:15px;
    background:#fff8df;
    color:#302719;
    outline:none;
    font-family:Arial,sans-serif;
    font-size:15px;
    transition:.2s;
}

input:focus{
    border-color:#c79519;
    box-shadow:0 0 0 4px rgba(199,149,25,.15);
}

.login-btn{
    width:100%;
    border:3px solid #4b3b25;
    border-radius:16px;
    padding:13px;
    background:#e6bd45;
    color:#302719;
    font-family:Arial,sans-serif;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    box-shadow:4px 5px 0 #4b3b25;
    transition:.2s;
}

.login-btn:hover{
    transform:translateY(-3px);
    box-shadow:6px 8px 0 #4b3b25;
}

.login-btn:active{
    transform:translate(2px,2px);
    box-shadow:2px 2px 0 #4b3b25;
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;
    padding:12px 14px;
    margin-bottom:17px;
    border-radius:12px;
    font-size:13px;
    font-weight:700;
    text-align:center;
    line-height:1.5;
}

.message.show{display:block}

.message.error{
    background:#ffe3d9;
    border:2px solid #a84a2a;
    color:#7d301b;
}

.message.success{
    background:#e5f4d5;
    border:2px solid #638b38;
    color:#3f6120;
}

.register{
    text-align:center;
    margin-top:25px;
    color:#776b56;
    font-size:13px;
}

.register a{
    color:#a06d08;
    font-weight:800;
    text-decoration:none;
}

.register a:hover{text-decoration:underline}

.footer{
    text-align:center;
    margin-top:24px;
    font-size:11px;
    font-weight:700;
    color:#776b56;
}

@media(max-width:480px){
    .card{
        padding:32px 22px;
        border-width:4px;
        border-radius:25px;
    }

    .logo{font-size:42px}
}
</style>
</head>

<body>

<div class="card">

    <div class="icon">📖</div>

    <div class="logo">தமிழ்</div>

    <div class="title">
        Tamil Study
    </div>

    <div class="subtitle">
        Sign in to access your study materials
    </div>

    <div id="message" class="message"></div>

    <form id="loginForm">

        <div class="group">

            <label for="email">
                Email Address
            </label>

            <input
                id="email"
                type="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

        </div>

        <button
            id="loginBtn"
            class="login-btn"
            type="submit"
        >
            Continue →
        </button>

    </form>

    <div class="register">
        Don't have access?
        <a href="payment.html">
            Register / Pay ₹50
        </a>
    </div>

    <div class="footer">
        By Madhumathi | B.Sc Data Science & AI
    </div>

</div>

<script>

const SUPABASE_URL =
    "https://ozsnvtbregzknawdyncg.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_psAoSdnCvmGBUt38h9ihxQ_evtiqbBi";

const form =
    document.getElementById("loginForm");

const loginBtn =
    document.getElementById("loginBtn");

const message =
    document.getElementById("message");


function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message show " + type;

}


form.addEventListener("submit",async function(event){

    event.preventDefault();

    const email =
        document.getElementById("email")
        .value
        .trim()
        .toLowerCase();

    if(!email){
        showMessage("Please enter your email address.","error");
        return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Checking...";

    try{

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/payments" +
            "?select=id,email,status" +
            "&email=eq." +
            encodeURIComponent(email),
            {
                headers:{
                    "apikey":SUPABASE_KEY,
                    "Authorization":"Bearer " + SUPABASE_KEY
                }
            }
        );

        if(!response.ok){
            throw new Error("Unable to connect to payment system.");
        }

        const records = await response.json();

        const approved =
            records.some(function(record){

                return String(record.status)
                    .trim()
                    .toLowerCase() === "approved";

            });


        if(approved){

            localStorage.setItem(
                "student_email",
                email
            );

            localStorage.setItem(
                "payment_status",
                "approved"
            );

            showMessage(
                "Payment approved! Opening Tamil Study...",
                "success"
            );

            setTimeout(function(){

                window.location.href =
                    "index.html";

            },700);

            return;

        }


        localStorage.setItem(
            "student_email",
            email
        );

        localStorage.setItem(
            "payment_status",
            "pending"
        );

        window.location.href =
            "payment.html";

    }

    catch(error){

        console.error(error);

        showMessage(
            "Unable to check your account. Please try again.",
            "error"
        );

        loginBtn.disabled = false;
        loginBtn.textContent = "Continue →";

    }

});

</script>

</body>
</html>
