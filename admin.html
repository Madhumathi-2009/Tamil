<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head><body style="font-family:Arial;padding:20px">
<h2>Admin - Approve Payments</h2>
<div id="loginDiv"><input id="email" placeholder="Your Admin Email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="msg"></p></div>
<div id="list" style="display:none"></div>
<script>
const supabase = window.supabase.createClient('https://ztocwdfliodtjvmddqvb.supabase.co', 'sb_publishable_YhnQ6f1iSiaXt92GamwJPA_YWBIal-t');
async function login(){ const e=document.getElementById('email').value; const p=document.getElementById('password').value; const {error}=await supabase.auth.signInWithPassword({email:e,password:p}); if(error){document.getElementById('msg').innerText=error.message;return;} document.getElementById('loginDiv').style.display='none'; document.getElementById('list').style.display='block'; load(); }
async function load(){ const {data}=await supabase.from('payments').select('*').eq('status','pending').order('id',{ascending:false}); const div=document.getElementById('list'); if(!data||data.length==0){div.innerHTML='<h3>No pending ✅</h3>';return;} div.innerHTML='<h3>Pending: '+data.length+'</h3>'; data.forEach(p=>{div.innerHTML+=`<div style="border:1px solid #ccc;padding:15px;margin:10px 0"><p><b>${p.email}</b></p><img src="${p.screenshot_url}" width="200"><br><button onclick="approve('${p.id}')" style="background:green;color:white;padding:8px">APPROVE</button> <button onclick="reject('${p.id}')" style="background:red;color:white;padding:8px">Reject</button></div>`}); }
async function approve(id){ await supabase.from('payments').update({status:'approved'}).eq('id',id); alert('Approved!'); load(); }
async function reject(id){ await supabase.from('payments').update({status:'rejected'}).eq('id',id); load(); }
</script></body></html>
