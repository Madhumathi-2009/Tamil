<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pay Rs.100</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head><body style="font-family:Arial;max-width:500px;margin:20px auto;padding:20px;text-align:center;border:1px solid #ddd;border-radius:10px">
<h2>Pay Rs.100 to Get Access</h2>
<p>Scan QR and Pay</p>
<img src="qr.jpg" width="250" style="border:2px solid #000;padding:5px">
<p><b>UPI: madhu12lakshmi@oksbi</b></p>
<hr>
<h3>After Payment, Upload Screenshot</h3>
<input type="file" id="file" accept="image/*"><br><br>
<button onclick="upload()" style="padding:12px 25px;background:green;color:white;border:none;border-radius:5px">Upload Screenshot</button>
<p id="msg" style="color:green;font-weight:bold"></p>
<p id="emailshow" style="font-size:12px"></p>
<script>
const supabase = window.supabase.createClient('https://ztocwdfliodtjvmddqvb.supabase.co', 'sb_publishable_YhnQ6f1iSiaXt92GamwJPA_YWBIal-t');
async function check(){ const {data:{user}} = await supabase.auth.getUser(); if(!user) location.href='login.html'; else document.getElementById('emailshow').innerText='Logged in: '+user.email; }
check();
async function upload(){
  const file=document.getElementById('file').files[0];
  if(!file) return alert('Select screenshot');
  document.getElementById('msg').innerText='Uploading...';
  const {data:{user}} = await supabase.auth.getUser();
  const fileName = user.email.replace(/[^a-zA-Z0-9]/g,'_') + '_' + Date.now() + '.jpg';
  const {error} = await supabase.storage.from('screenshots').upload(fileName, file);
  if(error){ document.getElementById('msg').innerText='Error: '+error.message; return; }
  const {data:urlData} = supabase.storage.from('screenshots').getPublicUrl(fileName);
  await supabase.from('payments').insert({email:user.email, screenshot_url:urlData.publicUrl, status:'pending'});
  document.getElementById('msg').innerText='✅ Uploaded! Wait for approval. After I approve, login again to see notes.';
}
</script></body></html>
